_target_: planning.smooth_gd.SmoothGDPlanner
horizon: 5
action_noise: 0.003
sample_type: 'randn' # 'zero' or 'randn'
lr: 1
opt_steps: 1000
eval_every: 10

name: smooth_gd
# phase 3 options (defaults = upstream GD); override without "+", e.g. planner.optimizer=adam
optimizer: sgd      # sgd (upstream update) | adam
restarts: 1         # must be 1 for smooth_gd (smoothing + restarts is out of scope)
init_scale: 1.0     # std of the randn init

# smoothing: gradient = mean over K perturbed copies a + sigma * eps of each plan
K: 8                # perturbations per plan per step
sigma0: 0.3         # sigma at the first step
sigma_min: 0.03     # sigma at the last step (linear / geom)
sigma_schedule: geom  # const | linear | geom
antithetic: true    # +eps / -eps pairs (needs even K)
