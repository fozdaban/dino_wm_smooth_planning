ckpt_base_path: /home/cc/ckpt
model_name: wall_single
model_epoch: latest
seed: 99
n_evals: 50
goal_source: random_state
goal_H: 5
n_plot_samples: 10
debug_dset_init: false
wm_eval_mode: false
objective:
  _target_: planning.objectives.create_objective_fn
  alpha: 1
  base: 2
  mode: last
planner:
  _target_: planning.smooth_gd.SmoothGDPlanner
  horizon: 5
  action_noise: 0.003
  sample_type: randn
  lr: 0.1
  opt_steps: 125
  eval_every: 10
  name: smooth_gd
  optimizer: adam
  restarts: 1
  init_scale: 1.0
  K: 16
  sigma0: 1
  sigma_min: 0.1
  sigma_schedule: geom
  antithetic: true
  episode_chunk: 25
  oracle_stop: false
